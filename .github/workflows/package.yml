name: 自动打包扩展

# push 到 main 时把 kirito扩展/ 打成 zip，挂到 latest Release（同名资产覆盖）
# 客户端更新器固定下载 releases/latest/download/kirito-extension.zip
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 Python zipfile 打包：对中文条目名写入 UTF-8(EFS) 标志，游戏内 JSZip 解压不乱码
      # 同时生成 manifest.json（路径→md5，供客户端增量更新比对）和 version.txt（版本号标记）
      - name: 打包 kirito扩展 为 zip
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, zipfile
          count = 0
          manifest = {}
          with zipfile.ZipFile("kirito-extension.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, dirs, files in os.walk("kirito扩展"):
                  for f in sorted(files):
                      p = os.path.join(root, f)
                      z.write(p, p)
                      with open(p, "rb") as fh:
                          manifest[p.replace(os.sep, "/")] = hashlib.md5(fh.read()).hexdigest()
                      count += 1
          version = json.load(open("kirito扩展/info.json", encoding="utf-8"))["version"]
          with open("version.txt", "w", encoding="utf-8") as f:
              f.write(version)
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, sort_keys=True)
          print(f"打包完成：{count} 个文件，版本 {version}，清单 {len(manifest)} 条")
          EOF

      - name: 创建或更新 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "kirito扩展 自动打包" \
            --notes "main 分支 push 自动打包，供客户端「更新中心」下载解压覆盖" \
            --target "$GITHUB_SHA"
          # 上传顺序：zip → manifest.json → version.txt，version.txt就位即代表本批资产完整可用
          gh release upload latest kirito-extension.zip --clobber
          gh release upload latest manifest.json --clobber
          gh release upload latest version.txt --clobber
          echo "已上传 kirito-extension.zip + manifest.json + version.txt（commit $GITHUB_SHA）"
