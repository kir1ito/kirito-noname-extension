name: 自动打包扩展

# push 到 main 时把 kirito扩展/ 打成 zip，挂到 latest Release（同名资产覆盖）
# 客户端更新器固定下载 releases/latest/download/kirito-extension.zip
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 Python zipfile 打包：对中文条目名写入 UTF-8(EFS) 标志，游戏内 JSZip 解压不乱码
      # 同时生成 manifest.json（路径→md5，供客户端增量更新比对）和 version.txt（版本号标记）
      - name: 打包 kirito扩展 为 zip
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, zipfile
          # 仓库杂物不进更新包（.bak备份/.md文档/隐藏文件等）
          EXCLUDE_EXT = (".bak", ".pyc", ".tmp")
          EXCLUDE_NAME = ("README.md", ".gitignore", ".DS_Store")
          count = 0
          manifest = {}
          with zipfile.ZipFile("kirito-extension.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, dirs, files in os.walk("kirito扩展"):
                  for f in sorted(files):
                      if f in EXCLUDE_NAME or f.endswith(EXCLUDE_EXT) or f.startswith("."):
                          continue
                      p = os.path.join(root, f)
                      z.write(p, p)
                      with open(p, "rb") as fh:
                          data = fh.read()
                          # 值格式"md5:size"：客户端增量除哈希外还校验本地文件尺寸，
                          # 安卓端历史版本落盘损坏的二进制（膨胀约11倍的JSON文本）凭尺寸即可检出重下
                          manifest[p.replace(os.sep, "/")] = f"{hashlib.md5(data).hexdigest()}:{len(data)}"
                      count += 1
          version = json.load(open("kirito扩展/info.json", encoding="utf-8"))["version"]
          with open("version.txt", "w", encoding="utf-8") as f:
              f.write(version)
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, sort_keys=True)
          print(f"打包完成：{count} 个文件，版本 {version}，清单 {len(manifest)} 条")
          EOF

      - name: 创建或更新 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "kirito扩展 自动打包" \
            --notes "main 分支 push 自动打包，供客户端「更新中心」下载解压覆盖" \
            --target "$GITHUB_SHA"
          # 上传顺序：zip → manifest.json → version.txt，version.txt就位即代表本批资产完整可用
          gh release upload latest kirito-extension.zip --clobber
          gh release upload latest manifest.json --clobber
          gh release upload latest version.txt --clobber
          echo "已上传 kirito-extension.zip + manifest.json + version.txt（commit $GITHUB_SHA）"

      # dist分支只含三个发版资产（zip/manifest/version.txt）：供CNB等纯git镜像走raw直链，
      # 无需在CNB侧另建Release；[skip ci]防触发自身，且workflow只监听main不受影响
      - name: 发布资产到 dist 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name 'kirito-extension.zip' ! -name 'manifest.json' ! -name 'version.txt' ! -name '.git' -exec rm -rf {} +
          git add -f kirito-extension.zip manifest.json version.txt
          git commit -m "发版资产 v$(cat version.txt) [skip ci]"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-tmp:dist
          echo "已推送 dist 分支（zip + manifest.json + version.txt）"

      # CNB（cnb.cool）镜像同步：main（增量raw源）+ dist（发版资产）。需在GitHub Secrets配置CNB_TOKEN
      # （cnb.cool 个人设置生成的访问令牌），未配置时本步跳过；同步失败不影响Release发布
      - name: 同步到 CNB 镜像
        if: env.CNB_TOKEN != ''
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        continue-on-error: true
        run: |
          git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/kir1ito/kirito-noname-extension.git" origin/main:main dist-tmp:dist
          echo "已同步 main 与 dist 到 cnb.cool/kir1ito/kirito-noname-extension"
